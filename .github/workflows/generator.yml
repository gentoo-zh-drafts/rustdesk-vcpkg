name: "Generator"
on:
  workflow_dispatch:
    inputs:
      RUSTDESK_TAG:
        description: "rustdesk tag"
        required: true
      VCPKG_TAG:
        description: "vcpkg tag"
        required: true

jobs:
  Generator:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triplet: x64-linux
          - runner: ubuntu-24.04-arm
            triplet: arm64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: install depends
        run: |
          sudo apt-get update
          sudo apt-get install -y \
                        build-essential \
                        clang \
                        curl \
                        gcc \
                        git \
                        g++ \
                        libayatana-appindicator3-dev \
                        libasound2-dev \
                        libclang-dev \
                        libdbus-1-dev \
                        libglib2.0-dev \
                        libgstreamer1.0-dev \
                        libgstreamer-plugins-base1.0-dev \
                        libgtk-3-dev \
                        liblzma-dev \
                        libpam0g-dev \
                        libpulse-dev \
                        libva-dev \
                        libxcb-randr0-dev \
                        libxcb-shape0-dev \
                        libxcb-xfixes0-dev \
                        libxdo-dev \
                        libxfixes-dev \
                        ninja-build \
                        pkg-config \
                        python3 \
                        rpm \
                        unzip \
                        wget \
                        nasm \
                        xz-utils \
                        autoconf \
                        automake \
                        libtool \
                        zip

      # vcpkg's z_vcpkg_spdx.cmake uses string(JSON ... STRING_ENCODE), which
      # needs CMake 4.3 or newer. vcpkg fetches its own CMake on x86_64 but not
      # on aarch64, where it falls back to the 3.31 in the runner image and the
      # aom build dies. Install the same version for both so neither depends on
      # what the image happens to ship.
      - name: install cmake
        run: |
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64) arch=aarch64 ;;
            *) echo "unexpected $(uname -m)" >&2; exit 1 ;;
          esac
          url=https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-${arch}.tar.gz
          curl -fsSL "$url" | sudo tar xz -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-linux-${arch}/bin" >> "$GITHUB_PATH"
        env:
          CMAKE_VERSION: "4.4.0"

      - name: checkout rustdesk
        uses: actions/checkout@v6
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.RUSTDESK_TAG }}
          path: rustdesk
          submodules: true

      - name: checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ inputs.VCPKG_TAG }}
          path: vcpkg
          submodules: true

      - name: vcpkg configure
        working-directory: vcpkg
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          sh bootstrap-vcpkg.sh -disableMetrics
          # https://learn.microsoft.com/en-us/vcpkg/users/versioning-troubleshooting?WT.mc_id=vcpkg_inproduct_cli#shallow-clone-version-constraint
          git fetch --unshallow

      - name: vcpkg install
        working-directory: rustdesk
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          $VCPKG_ROOT/vcpkg install --triplet ${{ matrix.triplet }} --x-install-root="$VCPKG_ROOT/installed"

      - name: create tarball
        run: |
          rm -rf vcpkg/{.git,downloads,buildtrees}
          tar czf rustdesk-${{ inputs.RUSTDESK_TAG }}-vcpkg-${{ inputs.VCPKG_TAG }}-${{ matrix.triplet }}-lite.tar.gz vcpkg

      - name: upload tarball for the release job
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-${{ matrix.triplet }}
          path: rustdesk-${{ inputs.RUSTDESK_TAG }}-vcpkg-${{ inputs.VCPKG_TAG }}-${{ matrix.triplet }}-lite.tar.gz
          retention-days: 1

  # One release job, so the two architectures cannot race each other while
  # moving the tag and creating the release.
  Release:
    needs: Generator
    permissions: write-all # required by push tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: delete old tag
        run: |
          git config --global --add safe.directory '*'
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git tag --delete ${{ inputs.RUSTDESK_TAG }} || echo yes

      - name: download tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: vcpkg-*
          merge-multiple: true

      - name: push tag
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: true
          tags: true

      - name: upload to release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rustdesk-${{ inputs.RUSTDESK_TAG }}-vcpkg-${{ inputs.VCPKG_TAG }}-x64-linux-lite.tar.gz
            rustdesk-${{ inputs.RUSTDESK_TAG }}-vcpkg-${{ inputs.VCPKG_TAG }}-arm64-linux-lite.tar.gz
          tag_name: ${{ inputs.RUSTDESK_TAG }}
